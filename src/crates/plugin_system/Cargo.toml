[package]
name = "plugin_system"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
shared = { path = "../shared/" }
macros = { path = "../macros/" }
plugin_interface = { path = "../../../plugin_interface/" }

libloading = "0.8.6"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.4", features = ["full"] }
lazy_static = "1.5"

