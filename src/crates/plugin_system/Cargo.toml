[package]
name = "plugin_system"
version.workspace = true
edition.workspace = true

[dependencies]
shared = { path = "../shared/" }
macros = { path = "../macros/" }
plugin_api.path = "../../../plugin_api/"

libloading = "0.8.6"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.4", features = ["full"] }
lazy_static = "1.5"
derive_more = { version = "1.0.0", features = ["deref", "from", "into"] }
netcorehost = "0.17.0"
